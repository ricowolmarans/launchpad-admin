<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Launchpad Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="config.js"></script>
<script src="shell.js"></script>
<script>
requireAuth();
const content = mountShell('dashboard');

content.innerHTML = `
  <div class="topbar">
    <h1>Orders</h1>
    <select id="status-filter" style="width:180px; margin:0;">
      <option value="">All statuses</option>
      <option value="new">New</option>
      <option value="concept">Concept</option>
      <option value="revision">Revision</option>
      <option value="half_paid">Half Paid</option>
      <option value="setup">Setup</option>
      <option value="full_paid">Full Paid</option>
      <option value="live">Live</option>
      <option value="done">Done</option>
      <option value="archived">Archived</option>
    </select>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Company</th><th>Tracking</th><th>Package</th><th>Status</th><th>Created</th></tr></thead>
      <tbody id="orders-tbody"></tbody>
    </table>
  </div>
  <div id="modal-root"></div>
`;

document.getElementById('status-filter').addEventListener('change', loadOrders);
loadOrders();

async function loadOrders() {
  const status = document.getElementById('status-filter').value;
  const orders = await api(`/orders${status ? `?status=${status}` : ''}`);
  const visible = status ? orders : orders.filter(o => o.status !== 'done');
  const tbody = document.getElementById('orders-tbody');
  tbody.innerHTML = visible.map(o => `
    <tr onclick="openOrder('${o.id}')">
      <td>${o.company_name}</td>
      <td>${o.tracking_username}</td>
      <td>${o.package_tier}</td>
      <td><span class="status-pill">${o.status.replace('_',' ')}</span></td>
      <td>${new Date(o.created_at * 1000).toLocaleDateString()}</td>
    </tr>
  `).join('') || '<tr><td colspan="5" style="color:var(--muted)">No orders yet.</td></tr>';
}

async function openOrder(id) {
  const order = await api(`/orders/${id}`);
  const comments = await api(`/orders/${id}/comments`);
  const previews = await api(`/orders/${id}/previews`);
  const pinStatus = await api(`/orders/${id}/pin`);

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h2>${order.company_name}</h2>
        <p style="color:var(--muted); font-size:0.8rem; margin-bottom:8px;">${order.contact_name} · ${order.email}</p>

        <label>Tracking Username</label>
        <div style="display:flex; gap:6px; margin-bottom:4px;">
          <input id="tracking-username-input" value="${order.tracking_username}" style="margin:0;">
          <button onclick="updateTrackingUsername('${id}')" class="secondary" style="flex-shrink:0; padding:10px 14px;">Save</button>
        </div>
        <p id="tracking-username-status" style="font-size:0.75rem; margin-bottom:16px;"></p>

        <label>Status</label>
        <select id="status-select">
          ${['new','concept','revision','half_paid','setup','full_paid','live','done','archived'].map(s =>
            `<option value="${s}" ${s===order.status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
        </select>
        <button onclick="updateStatus('${id}')" class="secondary" style="margin-bottom:16px;">Update Status</button>
        <div style="display:flex; gap:8px; margin-bottom:16px;">
          <button onclick="markDone('${id}')" style="flex:1;">Mark Done</button>
          <button onclick="deleteOrderConfirm('${id}')" class="secondary" style="flex:1; border-color:var(--red); color:var(--red);">Delete Order</button>
        </div>

        <label>Plain-English Summary</label>
        <div id="ai-summary-box" style="font-size:0.85rem; border:1px solid var(--border); padding:10px; margin-bottom:8px; ${order.ai_summary ? '' : 'color:var(--muted)'}">
          ${order.ai_summary ? escapeHtml(order.ai_summary) : 'No summary generated yet.'}
        </div>
        <button onclick="genSummary('${id}', false)" class="secondary" style="margin-right:6px; margin-bottom:16px;">${order.ai_summary ? 'Refresh (cached)' : 'Generate'} Summary</button>
        ${order.ai_summary ? `<button onclick="genSummary('${id}', true)" class="secondary" style="margin-bottom:16px;">Force Regenerate</button>` : ''}

        <label>Website Preview</label>
        <input id="site-files-input" type="file" multiple webkitdirectory directory accept=".html,.htm,.css,.js,.mjs,.json,.svg,.png,.jpg,.jpeg,.gif,.webp,.ico,.woff,.woff2,.ttf,.otf,.mp4,.webm" style="margin-bottom:8px;">
        <p style="color:var(--muted); font-size:0.75rem; margin-bottom:8px;">Choose the complete website folder. It must include <code>index.html</code>; its CSS, scripts, images and fonts are kept together for a private preview. No public site URL is created.</p>
        <button onclick="submitPreview('${id}')" class="secondary" style="margin-bottom:4px;">Upload Preview Version</button>
        <p id="preview-upload-status" style="color:var(--muted); font-size:0.75rem; margin-bottom:16px;">Current versions: ${previews.length} · 250 files / 8 MB max</p>

        <label>Access PIN</label>
        <p style="font-size:0.8rem; margin-bottom:8px;">
          ${pinStatus.is_active ? `Active — ${pinStatus.attempts_remaining} attempt(s) left` : 'No active PIN'}
        </p>
        <button onclick="regenPin('${id}')" class="secondary" style="margin-bottom:16px;">Generate New PIN</button>

        <label>Comments</label>
        <div style="max-height:180px; overflow-y:auto; border:1px solid var(--border); padding:8px; margin-bottom:8px; font-size:0.85rem;">
          ${comments.map(c => `<div style="margin-bottom:8px;"><strong style="color:${c.author_type==='admin'?'var(--red-dim)':'var(--text)'}">${c.author_type}:</strong> ${escapeHtml(c.message)}</div>`).join('') || '<span style="color:var(--muted)">No comments.</span>'}
        </div>
        <textarea id="comment-input" rows="2" placeholder="Reply to customer..."></textarea>
        <button onclick="submitComment('${id}')" class="secondary" style="margin-bottom:16px;">Send Reply</button>

        <button onclick="document.querySelector('.modal-backdrop').remove()" style="width:100%">Close</button>
      </div>
    </div>
  `;
}

async function genSummary(id, force) {
  const box = document.getElementById('ai-summary-box');
  box.textContent = 'Generating...';
  try {
    const data = await api(`/orders/${id}/summary${force ? '?force=true' : ''}`, { method: 'POST', body: JSON.stringify({}) });
    box.textContent = data.summary;
    box.style.color = '';
  } catch (err) {
    box.textContent = `Failed: ${err.message}`;
  }
}

async function updateTrackingUsername(id) {
  const newUsername = document.getElementById('tracking-username-input').value.trim();
  const statusEl = document.getElementById('tracking-username-status');
  statusEl.textContent = '';
  if (!newUsername) { statusEl.textContent = 'Cannot be empty.'; statusEl.style.color = 'var(--red)'; return; }

  try {
    await api(`/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ tracking_username: newUsername }) });
    statusEl.textContent = 'Saved. Customer must use the new link/username from now on.';
    statusEl.style.color = '#1a8a3a';
    loadOrders();
  } catch (err) {
    statusEl.textContent = err.message.includes('UNIQUE') ? 'That username is already taken by another order.' : `Failed: ${err.message}`;
    statusEl.style.color = 'var(--red)';
  }
}

async function markDone(id) {
  await api(`/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ status: 'done' }) });
  document.querySelector('.modal-backdrop').remove();
  loadOrders();
}

async function deleteOrderConfirm(id) {
  if (!confirm('Delete this order permanently? This also removes its comments, previews, PINs and invoices. This cannot be undone.')) return;
  await api(`/orders/${id}`, { method: 'DELETE' });
  document.querySelector('.modal-backdrop').remove();
  loadOrders();
}

async function updateStatus(id) {
  const status = document.getElementById('status-select').value;
  await api(`/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
  document.querySelector('.modal-backdrop').remove();
  loadOrders();
}

async function submitPreview(id) {
  const input = document.getElementById('site-files-input');
  const status = document.getElementById('preview-upload-status');
  const selected = Array.from(input.files || []);
  if (!selected.length) { status.textContent = 'Choose your website folder first.'; status.style.color = 'var(--red)'; return; }
  if (selected.length > 250) { status.textContent = 'That folder has more than 250 files.'; status.style.color = 'var(--red)'; return; }

  const paths = selected.map(file => file.webkitRelativePath || file.name);
  const files = selected.map((file, index) => ({ file, path: paths[index] }));
  // Folder picker paths include the selected root folder. Strip that one segment so
  // index.html and assets resolve as they would when deployed at a site root.
  const firstSegments = files.map(item => item.path.split('/')[0]);
  if (firstSegments.length && firstSegments.every(segment => segment === firstSegments[0])) {
    files.forEach(item => { item.path = item.path.split('/').slice(1).join('/'); });
  }
  if (!files.some(item => item.path.toLowerCase() === 'index.html')) {
    status.textContent = 'The selected folder needs index.html at its top level.';
    status.style.color = 'var(--red)';
    return;
  }

  status.textContent = `Reading ${files.length} file${files.length === 1 ? '' : 's'}...`;
  status.style.color = 'var(--muted)';
  try {
    const payload = await Promise.all(files.map(async ({ file, path }) => ({
      path,
      content: (await readFileAsDataUrl(file)).split(',', 2)[1],
      content_type: file.type || mimeFromPath(path),
    })));
    status.textContent = 'Uploading preview...';
    const result = await api(`/orders/${id}/previews`, { method: 'POST', body: JSON.stringify({ files: payload }) });
    document.querySelector('.modal-backdrop').remove();
    openOrder(id);
  } catch (err) {
    status.textContent = `Upload failed: ${err.message}`;
    status.style.color = 'var(--red)';
  }
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error(`Could not read ${file.name}`));
    reader.readAsDataURL(file);
  });
}

function mimeFromPath(path) {
  const ext = path.split('.').pop().toLowerCase();
  return ({ html:'text/html; charset=utf-8', htm:'text/html; charset=utf-8', css:'text/css; charset=utf-8', js:'text/javascript; charset=utf-8', mjs:'text/javascript; charset=utf-8', json:'application/json', svg:'image/svg+xml', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', ico:'image/x-icon', woff:'font/woff', woff2:'font/woff2', ttf:'font/ttf', otf:'font/otf', mp4:'video/mp4', webm:'video/webm' })[ext] || 'application/octet-stream';
}

async function regenPin(id) {
  const data = await api(`/orders/${id}/pin`, { method: 'POST', body: JSON.stringify({}) });
  alert(`New PIN: ${data.pin}\\n\\nGive this to the customer now — it will not be shown again.`);
  document.querySelector('.modal-backdrop').remove();
  openOrder(id);
}

async function submitComment(id) {
  const message = document.getElementById('comment-input').value;
  if (!message.trim()) return;
  await api(`/orders/${id}/comments`, { method: 'POST', body: JSON.stringify({ message }) });
  document.querySelector('.modal-backdrop').remove();
  openOrder(id);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
