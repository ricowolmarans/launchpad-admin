<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity — Launchpad Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="config.js"></script>
<script src="shell.js"></script>
<script>
requireAuth();
const content = mountShell('activity');

content.innerHTML = `
  <div class="topbar"><h1>Activity Feed</h1></div>
  <div class="card activity-feed" id="feed"></div>
`;

loadFeed();

async function loadFeed() {
  const rows = await api('/activity?limit=200');
  document.getElementById('feed').innerHTML = rows.map(r => `
    <div class="row">
      <span class="time">${new Date(r.created_at*1000).toLocaleString()}</span>
      <span class="actor">${r.actor}</span>
      <span>${r.action}${r.detail ? ' — ' + r.detail : ''}</span>
    </div>
  `).join('') || '<p style="color:var(--muted)">No activity yet.</p>';
}
</script>
</body>
</html>
