<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders: Done — Launchpad Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="config.js"></script>
<script src="shell.js"></script>
<script>
requireAuth();
const content = mountShell('orders-done');

content.innerHTML = `
  <div class="topbar"><h1>Orders: Done</h1></div>
  <div class="card">
    <table>
      <thead><tr><th>Company</th><th>Tracking</th><th>Package</th><th>Created</th></tr></thead>
      <tbody id="orders-tbody"></tbody>
    </table>
  </div>
  <div id="modal-root"></div>
`;

loadOrders();

async function loadOrders() {
  const orders = await api('/orders?status=done');
  const tbody = document.getElementById('orders-tbody');
  tbody.innerHTML = orders.map(o => `
    <tr onclick="openOrder('${o.id}')">
      <td>${o.company_name}</td>
      <td>${o.tracking_username}</td>
      <td>${o.package_tier}</td>
      <td>${new Date(o.created_at * 1000).toLocaleDateString()}</td>
    </tr>
  `).join('') || '<tr><td colspan="4" style="color:var(--muted)">No completed orders yet.</td></tr>';
}

async function openOrder(id) {
  const order = await api(`/orders/${id}`);
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h2>${order.company_name}</h2>
        <p style="color:var(--muted); font-size:0.8rem; margin-bottom:16px;">${order.tracking_username} · ${order.contact_name} · ${order.email}</p>
        <label>Status</label>
        <select id="status-select">
          ${['new','concept','revision','half_paid','setup','full_paid','live','done','archived'].map(s =>
            `<option value="${s}" ${s===order.status?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
        </select>
        <button onclick="updateStatus('${id}')" class="secondary" style="margin-bottom:16px;">Move Back to Active</button>
        <button onclick="deleteOrderConfirm('${id}')" class="secondary" style="width:100%; border-color:var(--red); color:var(--red); margin-bottom:16px;">Delete Order</button>
        <button onclick="document.querySelector('.modal-backdrop').remove()" style="width:100%">Close</button>
      </div>
    </div>
  `;
}

async function updateStatus(id) {
  const status = document.getElementById('status-select').value;
  await api(`/orders/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
  document.querySelector('.modal-backdrop').remove();
  loadOrders();
}

async function deleteOrderConfirm(id) {
  if (!confirm('Delete this order permanently? This also removes its comments, previews, PINs and invoices. This cannot be undone.')) return;
  await api(`/orders/${id}`, { method: 'DELETE' });
  document.querySelector('.modal-backdrop').remove();
  loadOrders();
}
</script>
</body>
</html>
